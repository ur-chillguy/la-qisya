<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Qisya — Rental & Sewa Gaun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF3EF;--bg2:#F4E1D8;--card:#FFFBF9;--line:#ECD6CC;--ink:#3B2227;--muted:#8B706B;--rose:#B8704F;--rose2:#D99A7B;--wine:#7A1E36;--wine2:#5E1529;--ok:#2F7350;--warn:#9A5B0E;--bad:#B4233C;--r:16px;--sh:0 1px 2px rgba(91,40,40,.05),0 10px 28px -16px rgba(91,40,40,.28)}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1100px 600px at 5% -10%,#F7E2D8 0,transparent 60%),radial-gradient(900px 520px at 105% 5%,#F2DAD5 0,transparent 55%),var(--bg)}
h1,h2,h3,h4,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:.005em}
h4{font-size:19px;margin:20px 0 10px}
p{margin:0 0 10px}
.gold{background:linear-gradient(120deg,#8E4E36 0%,#D29373 42%,#A8603F 70%,#7A1E36 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
img{display:block;max-width:100%}
.icon{width:18px;height:18px;flex:none}
.muted,.meta{color:var(--muted)}.meta{font-size:13px}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.wrapf{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:500;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;min-height:44px;text-decoration:none;white-space:nowrap;background:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--wine);color:#fff;box-shadow:0 8px 18px -10px rgba(122,30,54,.7)}
.btn-primary:hover{background:var(--wine2)}
.btn-rose{background:linear-gradient(135deg,#B06A4B,#D49274);color:#fff}
.btn-ghost{border-color:var(--line);background:rgba(255,255,255,.5)}
.btn-ghost:hover{background:#fff;border-color:#E2C3B6}
.btn-wa{background:#1E8752;color:#fff}.btn-wa:hover{background:#176A40}
.btn-danger{background:var(--bad);color:#fff}
.btn-text{padding:6px 8px;min-height:34px;color:var(--wine)}
.btn-sm{padding:6px 13px;min-height:36px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled],.btn.busy{opacity:.55;pointer-events:none}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,a:focus-visible,.d:focus-visible,.sz:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;flex:none}
.ibtn:hover{border-color:var(--rose)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* form */
label.f{display:block;font-size:13.5px;font-weight:500;margin-bottom:12px}
label.f>span{display:block;margin-bottom:5px}
label.f small{color:var(--muted);font-weight:400}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(184,112,79,.16)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:6px 0 14px}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--wine)}
.err{color:var(--bad);font-size:13px;margin-top:4px}
/* demo bar */
.demo{background:#3B1F26;color:#F3D6C8;font-size:12.5px;padding:7px 16px;text-align:center}
.demo b{color:#fff}.demo button{background:none;border:1px solid rgba(243,214,200,.35);border-radius:99px;padding:2px 10px;margin-left:8px;font-size:12px}
/* shop */
.top{position:sticky;top:0;z-index:20;background:rgba(251,243,239,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:40px;height:40px;object-fit:cover;object-position:50% 30%;border-radius:50%;border:1px solid var(--line);background:#F6E3DA}
.brand b{font-family:"Cormorant Garamond",serif;font-size:21px;letter-spacing:.16em;font-weight:600}
.nav{margin-left:auto;display:flex;gap:2px;align-items:center}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px}
.nav a:hover{background:#fff}
@media(max-width:720px){.nav .hm{display:none}}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:56px 20px 36px}
.hero h1{font-size:clamp(40px,6.2vw,70px);line-height:1.02;font-weight:600}
.hero .tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:var(--wine);margin:10px 0 14px}
.hero .lead{font-size:16.5px;color:var(--muted);max-width:48ch;margin-bottom:22px}
.logo-card{background:#F6E2D8;border-radius:30px;padding:14px;box-shadow:var(--sh);border:1px solid #EFD2C5;transform:rotate(1.5deg)}
.logo-card img{border-radius:20px;width:100%}
.eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:11.5px;color:var(--rose);font-weight:600}
.facts{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}.facts b{font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--wine);line-height:1}.facts span{font-size:12.5px;color:var(--muted)}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:22px;padding:24px 20px}.logo-card{order:-1;max-width:260px;margin:0 auto;transform:none}.hero{text-align:center}.hero .lead{margin-inline:auto}.hero .row,.facts{justify-content:center}}
.sec{padding:40px 20px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-h h2{font-size:clamp(30px,4vw,42px);line-height:1.05}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;white-space:nowrap;font-size:14px;min-height:40px}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip em{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.filters{display:grid;grid-template-columns:1fr 170px 170px;gap:10px;margin:10px 0 22px}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.search{position:relative}.search .icon{position:absolute;left:12px;top:13px;color:var(--muted)}.search .inp{padding-left:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
@media(max-width:540px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -20px rgba(91,40,40,.45)}
.ph{aspect-ratio:3/4;background:#F2DCD2;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .ph img{transform:scale(1.04)}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,251,249,.94);color:var(--wine);font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card .bd{padding:12px 14px 15px;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:21px;line-height:1.1}
.price{font-weight:600;color:var(--wine)}
.szm{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.szm span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
@media(max-width:540px){.card h3{font-size:18px}.card .bd{padding:10px 11px 12px}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.step::before{counter-increment:s;content:"0" counter(s);font-family:"Cormorant Garamond",serif;font-size:34px;color:var(--rose2);line-height:1;display:block;margin-bottom:8px}
.step b{display:block;margin-bottom:4px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.info{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.li{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}.li .icon{color:var(--rose);margin-top:2px}
.terms{margin:0;padding-left:18px}.terms li{margin-bottom:6px}
.foot{border-top:1px solid var(--line);padding:22px 0 30px;margin-top:20px;font-size:13.5px;color:var(--muted)}
.foot .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.credit{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;color:var(--ink);font-size:12.5px;background:#fff}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);grid-column:1/-1}
.empty b{display:block;color:var(--ink);font-family:"Cormorant Garamond",serif;font-size:22px;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,20,25,.48);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal[hidden]{display:none}
#modal2{z-index:60}
@media(min-width:760px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1);position:relative;overscroll-behavior:contain}
@media(min-width:760px){.sheet{border-radius:22px;max-height:90vh}}
.sheet.wide{max-width:1000px}.sheet.narrow{max-width:420px}
.sheet-h{position:sticky;top:0;background:rgba(251,243,239,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);z-index:3}
.sheet-h h3{font-size:23px;line-height:1.1}
.sheet-h .ibtn{margin-left:auto}
.sheet-b{padding:18px 20px 24px}
.sheet-f{position:sticky;bottom:0;background:rgba(251,243,239,.96);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;z-index:3}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* dress detail */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:20px}
@media(min-width:761px){.dgrid>div:first-child{position:sticky;top:70px;align-self:start}}
@media(max-width:760px){.dgrid{grid-template-columns:1fr;padding:0 0 20px}.dinfo{padding:0 18px}}
.gal-main{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#F2DCD2}
@media(max-width:760px){.gal-main{border-radius:0}}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.88);border:0}
.gal-nav.l{left:10px}.gal-nav.r{right:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding:0 2px}
@media(max-width:760px){.thumbs{padding:0 18px}}
.thumbs button{width:58px;height:72px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;flex:none;background:#F2DCD2}
.thumbs button.on{border-color:var(--wine)}.thumbs img{width:100%;height:100%;object-fit:cover}
.dinfo h2{font-size:clamp(30px,4vw,40px);line-height:1.05;margin-top:2px}
.pbig{font-size:26px;font-weight:600;color:var(--wine);margin:10px 0 2px}.pbig span{font-size:14px;color:var(--muted);font-weight:400}
.desc{color:#5B4246;margin-top:10px;white-space:pre-line}
.szs{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:52px;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:500}
.sz.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.sz[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.cal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:"Cormorant Garamond",serif;font-size:20px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal-g .dw{font-size:11px;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.d{aspect-ratio:1;border-radius:10px;border:0;background:none;font-size:14px;display:grid;place-items:center;min-height:36px}
.d:hover:not([disabled]){background:var(--bg2)}
.d.past{color:#CDBAB4;cursor:not-allowed}
.d.full{background:repeating-linear-gradient(-45deg,#F7E3E6,#F7E3E6 4px,#FBEFF1 4px,#FBEFF1 8px);color:#B98A93;text-decoration:line-through;cursor:not-allowed}
.d.rng{background:#F3DCD2;border-radius:0}
.d.sel{background:var(--wine);color:#fff;border-radius:10px 0 0 10px}
.d.end{background:var(--rose);color:#fff;border-radius:0 10px 10px 0}
.d.sel.end{border-radius:10px}
.d.today{box-shadow:inset 0 0 0 1px var(--rose)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.avail{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:center}
.avail.ok{background:#E5F2EA;color:var(--ok)}.avail.no{background:#FBE7EA;color:var(--bad)}.avail.idle{background:var(--bg2);color:var(--muted)}
.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.sum .r.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:16px}
.sum .r.dp{color:var(--wine);font-weight:600}
.okmark{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#B06A4B,#D49274);color:#fff;display:grid;place-items:center;margin:6px auto 12px}
.okmark .icon{width:30px;height:30px}
.kode{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px dashed var(--rose);border-radius:14px;padding:12px;margin:14px 0}
.kode b{font-size:22px;letter-spacing:.08em;color:var(--wine)}
.pay{background:var(--bg2);border-radius:16px;padding:14px 16px;margin:12px 0}
.pay pre{font:inherit;white-space:pre-wrap;margin:6px 0 0;font-weight:600}
.qris{max-width:220px;margin:12px auto 0;border-radius:12px;border:1px solid var(--line);background:#fff}
.tl{display:flex;gap:4px;margin:14px 0}.tl div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.tl div::before{content:"";display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:6px}
.tl div.on{color:var(--wine);font-weight:600}.tl div.on::before{background:var(--wine)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-wait{background:#FCEFD8;color:#8A520C}.p-conf{background:#E4ECF8;color:#2B4E85}.p-out{background:#F6E0E6;color:var(--wine)}.p-done{background:#E2F1E7;color:var(--ok)}.p-cancel{background:#ECE7E6;color:#776663}.p-bad{background:#FBE1E5;color:var(--bad)}.p-warn{background:#FFF1D6;color:#8A520C}.p-muted{background:var(--bg2);color:var(--muted)}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#3B1F26;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad)}
/* admin */
.adm{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#3A1E25;color:#EED7CD;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .brand{padding:4px 8px 2px}.side .brand b{color:#F3CDB9;font-size:19px}.side .brand img{border-color:rgba(243,205,185,.3)}
.side .ssub{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#B99187;padding:0 8px 12px 58px;margin-top:-8px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:#E5CEC4;text-decoration:none;font-size:14.5px;min-height:42px}
.side a:hover{background:rgba(243,205,185,.08)}
.side a.on{background:rgba(243,205,185,.16);color:#fff}
.side a.on .icon{color:#F3CDB9}
.side .cnt{margin-left:auto;background:#D99A7B;color:#3A1E25;font-style:normal;font-size:11.5px;font-weight:600;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.sfoot{margin-top:auto;border-top:1px solid rgba(243,205,185,.12);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.sfoot .credit{background:transparent;border-color:rgba(243,205,185,.25);color:#D9B8AB;margin:8px 8px 0;justify-content:center}
.main{padding:26px 30px 90px;min-width:0}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph1 h2{font-size:clamp(30px,3.6vw,38px);line-height:1}
.monly{display:none}
@media(max-width:900px){
 .adm{grid-template-columns:minmax(0,1fr)}
 .side{height:auto;flex-direction:row;padding:8px;z-index:15;gap:0;overflow:visible}
 .side .brand,.side .ssub,.sfoot{display:none}
 .side nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;width:100%}.side nav::-webkit-scrollbar{display:none}
 .side a{white-space:nowrap;padding:8px 12px;font-size:13.5px}
 .main{padding:18px 14px 80px}
 .monly{display:flex}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:25px;font-weight:600;margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:linear-gradient(135deg,#6F1A31,#8E2943);color:#fff;border-color:transparent}.kpi.hl .l,.kpi.hl .s{color:#F3CDB9}
@media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.panel h3{font-size:22px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel+.panel{margin-top:16px}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.agenda .day{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--rose);font-weight:600;margin:12px 0 4px}
.agenda .it{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.bar{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#B06A4B,#7A1E36);border-radius:9px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media(max-width:420px){.bks{grid-template-columns:1fr}}
.bk-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bk-top .code{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.04em}
.bk-main{display:flex;gap:12px;margin:10px 0}
.bk-main img{width:54px;height:68px;border-radius:10px;object-fit:cover;background:#F2DCD2;flex:none}
.bk-money{text-align:right;margin-left:auto}
.bk-act{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .search{flex:1;min-width:200px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;box-shadow:var(--sh)}
.dc img{width:104px;object-fit:cover;background:#F2DCD2;flex:none;aspect-ratio:3/4}
.dc .b{padding:12px;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dc h3{font-size:20px;line-height:1.1}
.stk{display:flex;gap:5px;flex-wrap:wrap}
.stk span{font-size:11.5px;border-radius:7px;padding:2px 7px;background:var(--bg2)}
.stk span.z{background:#FBE1E5;color:var(--bad)}
.acal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.acal .dw{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.ac{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.ac:hover{border-color:var(--rose)}
.ac.o{opacity:.35}.ac.t{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}
.ac .n{font-size:13px;font-weight:600}
.ev{font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.ac{min-height:62px;padding:4px}.ev{font-size:0;height:5px;padding:0}.ac .more{font-size:10px}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.in{color:var(--ok)}.out{color:var(--bad)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.phc{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#F2DCD2;border:2px solid transparent}
.phc.cv{border-color:var(--wine)}
.phc img{width:100%;height:100%;object-fit:cover}
.phc .ops{position:absolute;inset:auto 4px 4px 4px;display:flex;gap:4px;justify-content:space-between}
.phc .ops button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center}
.phc .ops .icon{width:15px;height:15px}
.phc .cvl{position:absolute;top:4px;left:4px;font-size:10px;background:var(--wine);color:#fff;border-radius:99px;padding:1px 7px}
.upl{border:1.5px dashed #DDB9A9;border-radius:12px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;color:var(--rose);font-size:12.5px;cursor:pointer;background:#fff;padding:6px}
.upl input{display:none}
.szrow{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;margin-bottom:8px}
.sect{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sect:first-child{border-top:0;padding-top:0;margin-top:0}
.chart text{font-size:11px;fill:#8B706B;font-family:Jost,sans-serif}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--wine);border-radius:50%;animation:sp 0.8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#F3E2DA,#FAEEE9,#F3E2DA);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

let TOKEN = store.get('lq_token');
function call(action, payload) {
  return new Promise((res, rej) => {
    const done = r => {
      if (r && r.ok) return res(r.data);
      if (r && r.error === 'SESSION') { TOKEN = null; store.set('lq_token', null); if (S.view === 'admin') { toast(r.message, true); renderShop(); } }
      rej(new Error((r && r.message) || 'Terjadi kesalahan. Coba lagi.'));
    };
    if (IS_GAS) google.script.run.withSuccessHandler(done).withFailureHandler(e => rej(new Error(e && e.message ? e.message : 'Koneksi gagal. Periksa internet lalu coba lagi.'))).api(action, payload || {}, TOKEN);
    else if (API_URL) fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload: payload || {}, token: TOKEN }) }).then(r => r.json()).then(done).catch(() => rej(new Error('Koneksi gagal. Periksa internet lalu coba lagi.')));
    else setTimeout(() => done(Mock.api(action, JSON.parse(JSON.stringify(payload || {})), TOKEN)), 160);
  });
}

function renderGrid() {
  let l = S.dresses.slice();
  if (S.cat !== 'Semua') l = l.filter(d => d.kategori === S.cat);
  if (S.q) { const q = S.q.toLowerCase(); l = l.filter(d => (d.nama + ' ' + d.warna + ' ' + d.kategori + ' ' + d.kode).toLowerCase().includes(q)); }
  if (S.size) l = l.filter(d => d.ukuran.some(u => u.ukuran === S.size && +u.stok > 0));
  const by = { pop: (a, b) => (b.unggulan - a.unggulan) || String(b.dibuat).localeCompare(String(a.dibuat)), new: (a, b) => String(b.dibuat).localeCompare(String(a.dibuat)), low: (a, b) => a.harga - b.harga, high: (a, b) => b.harga - a.harga };
  l.sort(by[S.sort]);
  const p = S.settings.durasiPaket;
  $('#grid').innerHTML = l.length ? l.map(d => `<button class="card" data-act="dress" data-id="${d.id}">
    <div class="ph"><img loading="lazy" src="${esc(cover(d))}" alt="${esc(d.nama)}">${d.unggulan ? '<span class="badge">Unggulan</span>' : ''}</div>
    <div class="bd"><span class="meta">${esc(d.kategori)} · ${esc(d.warna)}</span><h3>${esc(d.nama)}</h3><div><span class="price">${rp(d.harga)}</span> <span class="meta">/ ${p} hari</span></div>
    <div class="szm">${d.ukuran.filter(u => +u.stok > 0).map(u => `<span>${esc(u.ukuran)}</span>`).join('')}</div></div></button>`).join('')
    : `<div class="empty"><b>Belum ada gaun yang cocok</b>Coba kategori atau ukuran lain.<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-act="resetf">Tampilkan semua gaun</button></div></div>`;
}

/* ---------- detail & booking ---------- */
async function openDress(id) {
  const d = S.dresses.find(x => x.id === id); if (!d) return;
  D = { d, img: 0, size: (d.ukuran.find(u => +u.stok > 0) || {}).ukuran || '', start: '', hari: S.settings.durasiPaket, cal: TODAY.slice(0, 7), av: null, step: 'detail', f: { nama: '', wa: '', alamat: '', catatan: '', ok: false } };
  openModal('<div id="dv"></div>', { size: 'wide' });
  renderDress();
  try { const av = await call('getAvailability', { gaunId: id }); if (D && D.d.id === id) { D.av = av; renderDress(); } }
  catch (e) { if (D) { D.av = { ranges: [], jeda: 0, err: 1 }; renderDress(); } }
}
const stokOf = () => +((D.d.ukuran.find(u => u.ukuran === D.size) || {}).stok || 0);
function dayFull(day) { if (!D.av || !D.size) return false; return D.av.ranges.filter(r => r.ukuran === D.size && r.mulai <= day && day <= r.selesai).length >= stokOf(); }
function rangeFree(start, hari) {
  if (!D.av) return null; const end = addDays(addDays(start, hari - 1), D.av.jeda || 0);
  return D.av.ranges.filter(r => r.ukuran === D.size && start <= r.selesai && r.mulai <= end).length < stokOf();
}
function calHTML(month, cellFn, nav) {
  const [y, m] = month.split('-').map(Number), first = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  let h = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(x => `<div class="dw">${x}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let d = 1; d <= n; d++) h += cellFn(y + '-' + pad(m) + '-' + pad(d), d);
  return `<div class="cal"><div class="cal-h"><button class="ibtn" data-act="${nav}" data-v="-1" aria-label="Bulan sebelumnya" ${month <= TODAY.slice(0, 7) ? 'disabled style="opacity:.3"' : ''}>${IC.l}</button><b>${mlabel(month)}</b><button class="ibtn" data-act="${nav}" data-v="1" aria-label="Bulan berikutnya">${IC.r}</button></div><div class="cal-g">${h}</div></div>`;
}
function renderDress() {
  const el = $('#dv'); if (!el || !D) return;
  if (D.step === 'done') return renderDone(el);
  const d = D.d, st = S.settings, fotos = d.foto && d.foto.length ? d.foto : [cover(d)];
  const end = D.start ? addDays(D.start, D.hari - 1) : '';
  const free = D.start && D.size ? rangeFree(D.start, D.hari) : null;
  const total = d.harga + Math.max(0, D.hari - st.durasiPaket) * d.hargaTambahan, dp = Math.round(total * st.dpPersen / 100);
  const cal = calHTML(D.cal, (day, n) => {
    const past = day < TODAY, full = !past && dayFull(day);
    let c = 'd'; if (past) c += ' past'; else if (full) c += ' full';
    if (D.start && day >= D.start && day <= end) c += day === D.start ? ' sel' : (day === end ? ' end' : ' rng');
    if (D.start && D.start === end && day === end) c += ' end';
    if (day === TODAY) c += ' today';
    return `<button class="${c}" data-act="pickday" data-v="${day}" ${past || full ? 'disabled' : ''} aria-label="${fdate(day)}${full ? ' penuh' : ''}">${n}</button>`;
  }, 'dcal');
  const durOpts = []; for (let h = st.durasiPaket; h <= st.durasiPaket + 7; h++) durOpts.push(h);
  let availHTML = `<div class="avail idle">${IC.cal} Pilih ukuran lalu klik tanggal ambil di kalender.</div>`;
  if (!D.av) availHTML = `<div class="avail idle">Memuat ketersediaan…</div>`;
  else if (D.av.err) availHTML = `<div class="avail no">${IC.alert} Ketersediaan gagal dimuat. Tutup lalu buka lagi gaun ini.</div>`;
  else if (free === true) availHTML = `<div class="avail ok">${IC.check} Tersedia: ${fday(D.start)} s/d ${fday(end)}</div>`;
  else if (free === false) availHTML = `<div class="avail no">${IC.alert} Ukuran ${esc(D.size)} sudah terisi di sebagian tanggal itu. Coba tanggal atau ukuran lain.</div>`;
  const canSubmit = free === true && D.f.nama.length >= 2 && normWa(D.f.wa).length >= 10 && D.f.ok;
  el.innerHTML = `${head(esc(d.kategori), '', false).replace('<h3>', '<h3 style="font-size:18px;font-family:Jost;font-weight:500;color:var(--muted)">')}
  <div class="dgrid">
    <div>
      <div class="gal-main"><img src="${esc(fotos[D.img] || fotos[0])}" alt="${esc(d.nama)}">${fotos.length > 1 ? `<button class="ibtn gal-nav l" data-act="gal" data-v="-1" aria-label="Foto sebelumnya">${IC.l}</button><button class="ibtn gal-nav r" data-act="gal" data-v="1" aria-label="Foto berikutnya">${IC.r}</button>` : ''}</div>
      ${fotos.length > 1 ? `<div class="thumbs">${fotos.map((f, i) => `<button class="${i === D.img ? 'on' : ''}" data-act="thumb" data-v="${i}" aria-label="Foto ${i + 1}"><img src="${esc(f)}" alt=""></button>`).join('')}</div>` : ''}
    </div>
    <div class="dinfo">
      <span class="meta">Kode ${esc(d.kode)} · ${esc(d.warna)}</span>
      <h2>${esc(d.nama)}</h2>
      <div class="pbig">${rp(d.harga)} <span>/ paket ${st.durasiPaket} hari</span></div>
      ${d.hargaTambahan ? `<div class="meta">+${rp(d.hargaTambahan)} per hari tambahan</div>` : ''}
      ${d.deskripsi ? `<p class="desc">${esc(d.deskripsi)}</p>` : ''}
      <h4>1 · Pilih ukuran</h4>
      <div class="szs">${d.ukuran.map(u => `<button class="sz ${D.size === u.ukuran ? 'on' : ''}" data-act="size" data-v="${esc(u.ukuran)}" ${+u.stok > 0 ? '' : 'disabled'}>${esc(u.ukuran)}</button>`).join('')}</div>
      <h4>2 · Pilih tanggal ambil</h4>
      ${cal}
      <div class="legend"><span><i style="background:var(--wine)"></i>Ambil</span><span><i style="background:#F3DCD2"></i>Masa sewa</span><span><i style="background:repeating-linear-gradient(-45deg,#F7E3E6,#F7E3E6 3px,#FBEFF1 3px,#FBEFF1 6px)"></i>Penuh</span></div>
      <label class="f" style="margin-top:12px"><span>Lama sewa</span><select class="inp" id="dhari">${durOpts.map(h => `<option value="${h}" ${h === D.hari ? 'selected' : ''}>${h} hari${h === st.durasiPaket ? ' (paket)' : ' (+' + (h - st.durasiPaket) + ' hari)'}</option>`).join('')}</select></label>
      ${availHTML}
      <h4>3 · Data pemesan</h4>
      <form id="bform" novalidate>
        <label class="f"><span>Nama lengkap</span><input class="inp" name="nama" autocomplete="name" value="${esc(D.f.nama)}" required></label>
        <label class="f"><span>No. WhatsApp</span><input class="inp" name="wa" inputmode="tel" autocomplete="tel" placeholder="08xx xxxx xxxx" value="${esc(D.f.wa)}" required></label>
        <label class="f"><span>Alamat <small>(opsional)</small></span><input class="inp" name="alamat" autocomplete="street-address" value="${esc(D.f.alamat)}"></label>
        <label class="f"><span>Catatan <small>(acara, tinggi badan, permintaan fitting)</small></span><textarea class="inp" name="catatan" rows="2">${esc(D.f.catatan)}</textarea></label>
        <div class="sum">
          <div class="r"><span>${esc(d.nama)} · ${esc(D.size || '-')}</span><span></span></div>
          <div class="r"><span>Paket ${st.durasiPaket} hari</span><span>${rp(d.harga)}</span></div>
          ${D.hari > st.durasiPaket ? `<div class="r"><span>Tambahan ${D.hari - st.durasiPaket} hari</span><span>${rp((D.hari - st.durasiPaket) * d.hargaTambahan)}</span></div>` : ''}
          <div class="r t"><span>Total sewa</span><span>${rp(total)}</span></div>
          <div class="r dp"><span>DP ${st.dpPersen}% (bayar sekarang)</span><span>${rp(dp)}</span></div>
          <div class="r"><span class="meta">Pelunasan saat ambil gaun</span><span class="meta">${rp(total - dp)}</span></div>
        </div>
        <label class="chk"><input type="checkbox" name="ok" ${D.f.ok ? 'checked' : ''}><span>Saya setuju dengan ketentuan sewa ${esc(st.namaToko)}.</span></label>
        <button class="btn btn-primary btn-block" type="submit" id="bsubmit" ${canSubmit ? '' : 'disabled'}>Booking & Bayar DP ${rp(dp)}</button>
        <p class="meta" style="text-align:center;margin-top:8px">Belum perlu bayar sekarang — instruksi DP muncul setelah booking.</p>
      </form>
    </div>
  </div>`;
  const form = $('#bform');
  form.addEventListener('input', () => { const f = formData(form); D.f = { nama: f.nama || '', wa: f.wa || '', alamat: f.alamat || '', catatan: f.catatan || '', ok: form.ok.checked }; $('#bsubmit').disabled = !(free === true && D.f.nama.length >= 2 && normWa(D.f.wa).length >= 10 && D.f.ok); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#bsubmit');
    try {
      const b = await busy(btn, () => call('createBooking', { gaunId: d.id, ukuran: D.size, tglAmbil: D.start, hari: D.hari, ...D.f }));
      D.step = 'done'; D.booking = b; renderDress(); $('#modal .sheet').scrollTop = 0;
    } catch (err) { try { D.av = await call('getAvailability', { gaunId: d.id }); renderDress(); } catch (e2) {} }
  });
  $('#dhari').addEventListener('change', e => { D.hari = +e.target.value; renderDress(); });
}
function renderDone(el) {
  const b = D.booking, st = S.settings;
  const msg = `Halo ${st.namaToko}, saya sudah booking gaun:\n\nKode: ${b.kode}\nNama: ${b.nama}\nGaun: ${b.gaunNama} (${b.ukuran})\nAmbil: ${fdate(b.tglAmbil)}\nKembali: ${fdate(b.tglKembali)}\nTotal: ${rp(b.total)}\nDP: ${rp(b.dp)}\n\nBerikut bukti transfer DP saya.`;
  el.innerHTML = `${head('Booking tercatat', '', false)}<div class="sheet-b" style="max-width:520px;margin:0 auto;text-align:center">
    <div class="okmark">${IC.check}</div>
    <h2 style="font-size:32px">Terima kasih, ${esc(b.nama.split(' ')[0])}!</h2>
    <p class="muted">Status booking: ${pill(b.status)}<br>Selesaikan DP dalam <b>${st.batasDpJam} jam</b> agar gaun terkunci untukmu.</p>

      <div class="r t"><span>Total</span><span>${rp(b.total)}</span></div>
      <div class="r dp"><span>DP yang harus dibayar</span><span>${rp(b.dp)}</span></div>
    </div>
    <div class="pay" style="text-align:left"><b>Transfer DP ke:</b><pre>${esc(st.rekening)}</pre>${st.qrisUrl ? `<div class="meta" style="margin-top:8px">atau scan QRIS:</div><img class="qris" src="${esc(st.qrisUrl)}" alt="QRIS ${esc(st.namaToko)}">` : ''}</div>
    <a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink(st.waAdmin, msg)}">${IC.wa} Kirim Bukti DP via WhatsApp</a>
    <p class="meta" style="margin-top:12px">Simpan kode booking. Status bisa dicek kapan saja lewat menu “Cek Booking”.</p>
  </div>`;

/* ---------- cek booking ---------- */
function openCek() {
  const el = openModal(head('Cek status booking', 'Masukkan kode & nomor WA saat booking') + `<div class="sheet-b"><form id="cform"><label class="f"><span>Kode booking</span><input class="inp" name="kode" placeholder="LQ261117-ABCD" autofocus required style="text-transform:uppercase"></label><label class="f"><span>No. WhatsApp</span><input class="inp" name="wa" inputmode="tel" placeholder="08xx" required></label><button class="btn btn-primary btn-block" type="submit">Cek Status</button></form><div id="cres"></div></div>`, { size: 'narrow' });
  $('#cform', el).addEventListener('submit', async e => {
    e.preventDefault(); const f = formData(e.target);
    try {
      const b = await busy(e.submitter, () => call('checkBooking', f));
      const steps = ['Menunggu DP', 'Terkonfirmasi', 'Diambil', 'Selesai'], idx = steps.indexOf(b.status);
      $('#cres').innerHTML = `<div class="sum" style="margin-top:18px"><div class="row between"><b>${esc(b.kode)}</b>${pill(b.status)}</div>
        ${b.status === 'Batal' ? '<p class="meta" style="margin-top:8px">Booking ini dibatalkan.</p>' : `<div class="tl">${steps.map((s, i) => `<div class="${i <= idx ? 'on' : ''}">${s === 'Diambil' ? 'Gaun diambil' : s}</div>`).join('')}</div>`}
        <div class="r"><span>Gaun</span><span>${esc(b.gaunNama)} · ${esc(b.ukuran)}</span></div>
        <div class="r"><span>Tanggal</span><span>${fdate(b.tglAmbil)} – ${fdate(b.tglKembali)}</span></div>
        <div class="r"><span>Total</span><span>${rp(b.total)}</span></div>
        <div class="r"><span>Sudah dibayar</span><span>${rp(b.dibayar)}</span></div>
        <div class="r t"><span>Sisa</span><span>${rp(b.total - b.dibayar)}</span></div></div>
        <a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink(S.settings.waAdmin, 'Halo ' + S.settings.namaToko + ', saya mau tanya booking ' + b.kode)}">${IC.wa} Hubungi Admin</a>`;
    } catch (err) { $('#cres').innerHTML = ''; }
  });
}

/* ---------- login pemilik ---------- */
function openLogin() {
  if (TOKEN) return enterAdmin();
  const el = openModal(head('Masuk Pemilik', S.settings.namaToko) + `<div class="sheet-b"><form id="lform"><label class="f"><span>PIN</span><input class="inp" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required style="letter-spacing:.4em;font-size:20px;text-align:center"></label><button class="btn btn-primary btn-block" type="submit">${IC.lock} Masuk</button></form></div>`, { size: 'narrow' });
  $('#lform', el).addEventListener('submit', async e => {
    e.preventDefault();
    try { const r = await busy(e.submitter, () => call('login', formData(e.target))); TOKEN = r.token; store.set('lq_token', TOKEN); closeModal(); enterAdmin(); } catch (err) { e.target.pin.select(); }
  });
}

    const q = S.cQ.toLowerCase();

    $('#clist').innerHTML = l.length ? `<table class="tbl"><thead><tr><th>Nama</th><th class="n">Sewa</th><th class="n">Total belanja</th><th>Terakhir</th><th>Gaun</th><th></th></tr></thead><tbody>${l.map(c => `<tr><td><b>${esc(c.nama)}</b>${c.n >= 2 ? ' <span class="pill p-out">' + IC.heart.replace('class="icon"', 'class="icon" style="width:11px;height:11px"') + ' Langganan</span>' : ''}<div class="meta">+${esc(c.wa)}</div></td><td class="n">${c.n}×</td><td class="n">${rp(c.total)}</td><td style="white-space:nowrap">${fdate(c.last)}</td><td class="meta">${esc(Object.keys(c.gaun).join(', '))}</td><td><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${waLink(c.wa, 'Halo Kak ' + c.nama.split(' ')[0] + ', ')}">${IC.wa}</a></td></tr>`).join('')}</tbody></table>` : `<div class="empty" style="border:0"><b>Belum ada pelanggan</b>Pelanggan muncul otomatis dari data booking.</div>`;
  }
};
VIEWS.pengaturan = {
  html() {
    const s = S.A.settings;
    const F = (k, l, opt = {}) => `<label class="f"><span>${l}${opt.hint ? ` <small>(${opt.hint})</small>` : ''}</span>${opt.ta ? `<textarea class="inp" name="${k}" rows="${opt.ta}">${esc(s[k])}</textarea>` : `<input class="inp" name="${k}" type="${opt.type || 'text'}" value="${esc(s[k])}" ${opt.type === 'number' ? 'min="0"' : ''}>`}</label>`;
    return pageHead('Pengaturan', 'Toko, aturan sewa, pembayaran', '') + `<div class="cols"><form id="sform" class="panel">
      <div class="sect">Profil toko</div>
      <div class="g2">${F('namaToko', 'Nama toko')}${F('tagline', 'Tagline')}</div>
      <div class="g2">${F('waAdmin', 'No. WhatsApp admin', { hint: 'format 62…' })}${F('instagram', 'Instagram', { hint: 'tanpa @' })}</div>
      ${F('alamat', 'Alamat butik')}${F('jamBuka', 'Jam buka')}
      <div class="sect">Aturan sewa</div>
      <div class="g2">${F('durasiPaket', 'Durasi 1 paket (hari)', { type: 'number' })}${F('dpPersen', 'DP (%)', { type: 'number' })}</div>
      <div class="g2">${F('jedaCuci', 'Jeda cuci antar-sewa (hari)', { type: 'number', hint: 'gaun tidak bisa dibooking' })}${F('batasDpJam', 'Batas bayar DP (jam)', { type: 'number' })}</div>
      ${F('syarat', 'Ketentuan sewa', { ta: 4, hint: 'satu baris = satu poin' })}
      <div class="sect">Pembayaran</div>
      ${F('rekening', 'Rekening tujuan', { ta: 2, hint: 'boleh lebih dari satu baris' })}
      <label class="f"><span>QRIS <small>(opsional)</small></span><div class="row"><img id="qprev" src="${esc(s.qrisUrl || '')}" alt="" style="width:84px;height:84px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;${s.qrisUrl ? '' : 'display:none'}"><label class="btn btn-ghost btn-sm">${IC.img} Unggah QRIS<input type="file" accept="image/*" id="qin" hidden></label>${s.qrisUrl ? '<button type="button" class="btn btn-text btn-sm" id="qdel">Hapus</button>' : ''}</div><input type="hidden" name="qrisUrl" value="${esc(s.qrisUrl || '')}"></label>
      <div class="sect">Kategori</div>
      ${F('kategori', 'Kategori gaun', { hint: 'pisahkan dengan koma' })}${F('kategoriPengeluaran', 'Kategori pengeluaran', { hint: 'pisahkan dengan koma' })}
      <button class="btn btn-primary" type="submit" style="margin-top:8px">Simpan Pengaturan</button>
    </form><div>
      <form id="pinform" class="panel"><h3>${IC.lock} Ganti PIN</h3><div class="g2"><label class="f"><span>PIN lama</span><input class="inp" type="password" inputmode="numeric" name="lama" required></label><label class="f"><span>PIN baru (4–8 angka)</span><input class="inp" type="password" inputmode="numeric" name="baru" required></label></div><button class="btn btn-ghost" type="submit">Ganti PIN</button></form>
      <div class="panel"><h3>Bagikan toko</h3><p class="muted sm">Bagikan link web app ini ke calon customer (bio Instagram, status WA). Pemilik masuk lewat tombol “Masuk Pemilik” di bagian bawah halaman yang sama.</p>${LIVE ? '' : `<button class="btn btn-ghost btn-sm" data-act="resetdemo">Reset data demo</button>`}</div>
      <div class="panel"><h3>Tentang aplikasi</h3><p class="muted sm">Data tersimpan di Google Spreadsheet milik pemilik; foto di folder Google Drive “La Qisya - Foto Gaun”.</p>${creditBtn()}</div>
    </div></div>`;
  },
  bind() {
    $('#sform').addEventListener('submit', async e => { e.preventDefault(); const f = formData(e.target); try { await busy(e.submitter, () => call('saveSettings', f)); toast('Pengaturan tersimpan'); await refresh(); reloadCatalog(); } catch (err) {} });
    $('#pinform').addEventListener('submit', async e => { e.preventDefault(); try { await busy(e.submitter, () => call('changePin', formData(e.target))); e.target.reset(); toast('PIN berhasil diganti'); } catch (err) {} });
    $('#qin').addEventListener('change', async e => { const file = e.target.files[0]; if (!file) return; try { const dataUrl = await resizeImg(file, 900, .9); const r = await call('uploadPhoto', { dataUrl, nama: 'qris.jpg' }); $('[name=qrisUrl]').value = r.url; const p = $('#qprev'); p.src = r.url; p.style.display = ''; toast('QRIS diunggah — klik Simpan Pengaturan'); } catch (err) { toast(err.message, true); } });
    const qd = $('#qdel'); if (qd) qd.addEventListener('click', () => { $('[name=qrisUrl]').value = ''; $('#qprev').style.display = 'none'; toast('QRIS dihapus — klik Simpan Pengaturan'); });
  }
};

/* ======================================================================
   EVENT DELEGATION
   ====================================================================== */
const findB = id => S.A.bookings.find(b => b.id === id);
const ACT = {
  close: () => closeModal(), close2: () => closeModal(true),
  totop: (el, e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  cat: el => { S.cat = el.dataset.v; $$('.chips .chip[data-act=cat]').forEach(c => c.classList.toggle('on', c === el)); renderGrid(); },
  resetf: () => { S.cat = 'Semua'; S.q = ''; S.size = ''; renderShop(); },
  dress: el => openDress(el.dataset.id),
  gal: el => { const n = (D.d.foto || []).length || 1; D.img = (D.img + +el.dataset.v + n) % n; renderDress(); },
  thumb: el => { D.img = +el.dataset.v; renderDress(); },
  size: el => { D.size = el.dataset.v; renderDress(); },
  pickday: el => { D.start = el.dataset.v; renderDress(); },
  dcal: el => { D.cal = addMonth(D.cal, +el.dataset.v); renderDress(); },
  copy: el => { try { navigator.clipboard.writeText(el.dataset.v); toast('Kode disalin'); } catch (e) { toast('Salin manual: ' + el.dataset.v); } },
  cek: (el, e) => { e.preventDefault(); openCek(); },
  owner: () => openLogin(),
  shop: (el, e) => { e.preventDefault(); reloadCatalog(true); },
  logout: async (el, e) => { e.preventDefault(); try { await call('logout'); } catch (x) {} TOKEN = null; store.set('lq_token', null); toast('Kamu sudah keluar'); reloadCatalog(true); },
  resetdemo: async () => { if (await confirmBox({ title: 'Reset data demo?', msg: 'Semua perubahan di mode demo akan dihapus dan diganti data contoh.', ok: 'Reset data demo', danger: true })) { Mock.reset(); toast('Data demo direset'); S.view === 'admin' ? refresh() : reloadCatalog(true); } },
  tab: (el, e) => { e.preventDefault(); S.tab = el.dataset.v; renderAdmin(); window.scrollTo(0, 0); },
  bkf: el => { S.bkF = el.dataset.v; renderTab(); },
  'bk-new': () => bookingForm(),
  'bk-edit': el => bookingForm(findB(el.dataset.id)),
  'bk-dp': el => payModal(findB(el.dataset.id), 'dp'),
  'bk-out': el => payModal(findB(el.dataset.id), 'out'),
  'bk-ret': el => payModal(findB(el.dataset.id), 'ret'),
  'bk-cancel': async el => { const b = findB(el.dataset.id); if (await confirmBox({ title: 'Batalkan booking ' + b.kode + '?', msg: `Booking <b>${esc(b.nama)}</b> untuk ${esc(b.gaunNama)} (${esc(b.ukuran)}) akan dibatalkan dan tanggalnya kembali tersedia. Uang yang sudah masuk (${rp(b.dibayar)}) tetap tercatat di keuangan.`, ok: 'Batalkan booking', danger: true })) { try { await call('updateBookingStatus', { id: b.id, status: 'Batal' }); toast('Booking dibatalkan'); refresh(); } catch (e) { toast(e.message, true); } } },
  'bk-del': async el => { const b = findB(el.dataset.id); if (await confirmBox({ title: 'Hapus booking ' + b.kode + '?', msg: 'Data booking dihapus permanen dari spreadsheet. Transaksi keuangan terkait tidak ikut terhapus.', ok: 'Hapus booking', danger: true })) { try { await call('deleteBooking', { id: b.id }); closeModal(); toast('Booking dihapus'); refresh(); } catch (e) { toast(e.message, true); } } },
  'bk-csv': () => downloadCSV([['Kode', 'Status', 'Nama', 'WA', 'Gaun', 'Ukuran', 'Ambil', 'Kembali', 'Hari', 'Total', 'Dibayar', 'Sisa', 'Sumber', 'Catatan'], ...S.A.bookings.map(b => [b.kode, b.status, b.nama, b.wa, b.gaunNama, b.ukuran, b.tglAmbil, b.tglKembali, b.hari, b.total, b.dibayar, b.total - b.dibayar, b.sumber, b.catatan])], 'laqisya-booking-' + TODAY + '.csv'),
  acal: el => { const v = +el.dataset.v; S.calM = v ? addMonth(S.calM, v) : TODAY.slice(0, 7); renderTab(); },
  calday: el => { const day = el.dataset.v; const l = S.A.bookings.filter(b => b.status !== 'Batal' && b.tglAmbil <= day && day <= b.tglKembali && (!S.calG || b.gaunId === S.calG)); openModal(head(fday(day), l.length + ' booking') + `<div class="sheet-b"><div class="bks" style="grid-template-columns:1fr">${l.map(bkCard).join('') || '<p class="muted">Tidak ada sewa di tanggal ini.</p>'}</div></div>`); },
  'd-new': () => dressEditor(),
  'd-edit': el => dressEditor(dressById(el.dataset.id)),
  'd-toggle': async el => { const d = JSON.parse(JSON.stringify(dressById(el.dataset.id))); d.status = d.status === 'Aktif' ? 'Maintenance' : 'Aktif'; try { await call('saveDress', d); toast(d.status === 'Aktif' ? 'Gaun tampil di katalog' : 'Gaun disembunyikan (Maintenance)'); await refresh(); reloadCatalog(); } catch (e) { toast(e.message, true); } },
  'd-del': async () => { if (await confirmBox({ title: 'Hapus ' + esc(E.nama) + '?', msg: 'Gaun dihapus dari koleksi. Riwayat booking tetap ada. Kalau hanya tidak disewakan lagi, lebih aman ubah status ke <b>Arsip</b>.', ok: 'Hapus gaun', danger: true })) { try { await call('deleteDress', { id: E.id }); closeModal(); toast('Gaun dihapus'); await refresh(); reloadCatalog(); } catch (e) { toast(e.message, true); } } },
  'ph-cover': el => { syncEd(); const i = +el.dataset.v; E.foto.unshift(E.foto.splice(i, 1)[0]); renderEditor(); },
  'ph-del': el => { syncEd(); E.foto.splice(+el.dataset.v, 1); renderEditor(); },
  'sz-add': el => { syncEd(); const v = el.dataset.v; if (v && E.ukuran.some(u => u.ukuran === v)) return toast('Ukuran ' + v + ' sudah ada.'); E.ukuran.push({ ukuran: v, stok: 1 }); renderEditor(); const rows = $$('.szrow [data-k=u]'); if (!v) rows[rows.length - 1].focus(); },
  'sz-del': el => { el.closest('.szrow').remove(); },
  'tx-new': () => txForm(),
  'tx-edit': el => txForm(S.A.transactions.find(t => t.id === el.dataset.id)),
  'tx-del': async el => { const t = S.A.transactions.find(x => x.id === el.dataset.id); if (await confirmBox({ title: 'Hapus transaksi?', msg: `${esc(t.kategori)} — ${rp(t.jumlah)} (${fdate(t.tanggal)}) akan dihapus dari catatan keuangan.`, ok: 'Hapus transaksi', danger: true })) { try { await call('deleteTransaction', { id: t.id }); toast('Transaksi dihapus'); refresh(); } catch (e) { toast(e.message, true); } } },
  txf: el => { S.txF = el.dataset.v; renderTab(); },
  'tx-csv': () => { const tm = S.A.transactions.filter(t => String(t.tanggal).startsWith(S.finM)); downloadCSV([['Tanggal', 'Jenis', 'Kategori', 'Keterangan', 'Metode', 'Kode Booking', 'Jumlah'], ...tm.map(t => [t.tanggal, t.jenis, t.kategori, t.keterangan, t.metode, t.bookingKode, t.jenis === 'Pemasukan' ? t.jumlah : -t.jumlah])], 'laqisya-keuangan-' + S.finM + '.csv'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  fn(el, e);
});

/* ======================================================================
   INIT
   ====================================================================== */
async function reloadCatalog(show) {
  try { const c = await call('getCatalog'); S.settings = c.settings; S.dresses = c.dresses; if (show) { renderShop(); window.scrollTo(0, 0); } }
  catch (e) { if (show) root.innerHTML = `<div class="wrap" style="padding:60px 20px;text-align:center"><h2>Gagal memuat katalog</h2><p class="muted">${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">Coba lagi</button></div>`; }
}
reloadCatalog(true);
</script>
